<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kristus - Bagikan Firman Tuhan</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            min-height: 100vh;
            background-image: url('https://images.unsplash.com/photo-1505506874110-6a7a69039b08?auto=format&fit=crop&w=2000&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #f0f0f0;
            font-family: 'Roboto', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7), rgba(0,0,0,0.9));
            z-index: -1;
        }
        header { text-align: center; margin-bottom: 2.5rem; }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            color: #ffd700;
            text-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }
        .subtitle { font-size: 1.25rem; opacity: 0.9; max-width: 700px; margin: 0.5rem auto; }
        .container {
            width: 100%;
            max-width: 850px;
            background: rgba(20, 20, 40, 0.5);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 2.5rem;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .search-box {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
        }
        #searchInput {
            flex: 1;
            min-width: 300px;
            padding: 1.1rem 1.8rem;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            background: rgba(255,255,255,0.15);
            color: white;
            outline: none;
            transition: all 0.4s;
        }
        #searchInput::placeholder { color: rgba(255,255,255,0.7); }
        #searchInput:focus {
            background: rgba(255,255,255,0.25);
            box-shadow: 0 0 0 5px rgba(255,215,0,0.4);
        }
        button {
            padding: 1.1rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            background: linear-gradient(135deg, #ffd700, #c9a32a);
            color: #111;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s;
            box-shadow: 0 10px 30px rgba(255,215,0,0.4);
        }
        button:hover { transform: translateY(-4px); box-shadow: 0 15px 40px rgba(255,215,0,0.6); }
        #verseDisplay {
            background: rgba(0,0,0,0.5);
            border-radius: 16px;
            padding: 2rem;
            margin: 1.5rem 0;
            font-size: 1.35rem;
            line-height: 1.7;
            border-left: 6px solid #ffd700;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.7s ease;
        }
        #verseDisplay.show {
            opacity: 1;
            transform: translateY(0);
        }
        #verseDisplay strong {
            color: #ffd700;
            display: block;
            font-size: 1.6rem;
            margin-bottom: 1rem;
        }
        #verseList { list-style: none; margin-top: 1.5rem; }
        #verseList li {
            background: rgba(255,255,255,0.1);
            margin: 1.2rem 0;
            padding: 1.4rem;
            border-radius: 14px;
            transition: all 0.4s;
        }
        #verseList li:hover {
            background: rgba(255,255,255,0.18);
            transform: translateX(10px);
        }
        #verseList li strong { color: #ffd700; }
        .no-results {
            text-align: center;
            padding: 2rem;
            font-size: 1.2rem;
            opacity: 0.8;
        }
        @media (max-width: 600px) {
            h1 { font-size: 2.8rem; }
            .container { padding: 2rem 1.5rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Kristus</h1>
        <p class="subtitle">Bagikan Firman Tuhan – Ayat Alkitab Injil secara acak atau cari kata kunci (misal: kasih, damai, Yohanes)</p>
    </header>

    <div class="container">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Cari ayat... (contoh: kasih, Yesus, Yohanes 3:16)">
            <button onclick="getRandomVerse()">Ayat Acak</button>
        </div>

        <div id="verseDisplay"></div>

        <ul id="verseList"></ul>
    </div>

    <script>
        const verses = [
            { ref: "Yohanes 3:16", text: "Karena begitu besar kasih Allah akan dunia ini, sehingga Ia telah mengaruniakan Anak-Nya yang tunggal, supaya setiap orang yang percaya kepada-Nya tidak binasa, melainkan beroleh hidup yang kekal." },
            { ref: "Yohanes 14:6", text: "Kata Yesus kepadanya: \"Akulah jalan dan kebenaran dan hidup. Tidak ada seorangpun yang datang kepada Bapa, kalau tidak melalui Aku.\"" },
            { ref: "Matius 11:28-30", text: "Marilah kepada-Ku, semua yang letih lesu dan berbeban berat, Aku akan memberikan kelegaan kepadamu. Pikullah kuk yang Kupasang dan belajarlah pada-Ku, karena Aku lemah lembut dan rendah hati dan jiwamu akan mendapat ketenangan." },
            { ref: "Roma 8:28", text: "Kita tahu sekarang, bahwa Allah turut bekerja dalam segala sesuatu untuk mendatangkan kebaikan bagi mereka yang mengasihi Dia, yaitu bagi mereka yang terpanggil sesuai dengan rencana Allah." },
            { ref: "Filipi 4:13", text: "Segala perkara dapat kutanggung di dalam Dia yang memberi kekuatan kepadaku." },
            { ref: "Yohanes 1:1", text: "Pada mulanya adalah Firman; Firman itu bersama-sama dengan Allah dan Firman itu adalah Allah." },
            { ref: "Yohanes 1:14", text: "Firman itu telah menjadi manusia dan diam di antara kita, dan kita telah melihat kemuliaan-Nya, yaitu kemuliaan sebagai Anak Tunggal Bapa, penuh kasih karunia dan kebenaran." },
            { ref: "Matius 6:33", text: "Tetapi carilah dahulu Kerajaan Allah dan kebenarannya, maka semuanya itu akan ditambahkan kepadamu." },
            { ref: "Yohanes 10:10", text: "Pencuri datang hanya untuk mencuri dan membunuh dan membinasakan; Aku datang supaya mereka mempunyai hidup, dan mempunyainya dalam segala kelimpahan." },
            { ref: "Efesus 2:8-9", text: "Sebab karena kasih karunia kamu diselamatkan oleh iman; itu bukan hasil usahamu, tetapi pemberian Allah, itu bukan hasil pekerjaanmu: jangan ada orang yang memegahkan diri." },
            { ref: "Roma 6:23", text: "Upah dosa ialah maut, tetapi karunia Allah ialah hidup yang kekal dalam Kristus Yesus, Tuhan kita." },
            { ref: "Yohanes 8:12", text: "Maka Yesus berkata pula kepada orang banyak, kata-Nya: \"Akulah terang dunia; barangsiapa mengikut Aku, ia tidak akan berjalan dalam kegelapan, melainkan ia akan mempunyai terang hidup.\"" },
            { ref: "Matius 5:16", text: "Demikianlah hendaknya terangmu bercahaya di depan orang, supaya mereka melihat perbuatanmu yang baik dan memuliakan Bapamu yang di sorga." },
            { ref: "Yohanes 15:13", text: "Tidak ada kasih yang lebih besar dari pada kasih seorang yang memberikan nyawanya untuk sahabat-sahabatnya." },
            { ref: "Ibrani 11:1", text: "Iman adalah dasar dari segala sesuatu yang kita harapkan, dan bukti dari segala sesuatu yang tidak kita lihat." },
            { ref: "Lukas 1:37", text: "Sebab bagi Allah tidak ada yang mustahil." },
            { ref: "Matius 7:7", text: "Mintalah, maka akan diberikan kepadamu; carilah, maka kamu akan mendapat; ketuklah, maka pintu akan dibukakan bagimu." },
            { ref: "Yakobus 1:2-3", text: "Hai saudara-saudaraku, anggaplah sebagai kebahagiaan bila kamu jatuh ke dalam berbagai pencobaan, sebab kamu tahu, bahwa ujian terhadap imanmu itu menghasilkan ketekunan." },
            { ref: "2 Korintus 5:17", text: "Jadi siapa yang ada di dalam Kristus, ia adalah ciptaan baru: yang lama sudah berlalu, sesungguhnya yang baru sudah datang." },
            { ref: "Yohanes 16:33", text: "Semuanya itu Kukatakan kepadamu, supaya kamu beroleh damai sejahtera di dalam Aku. Dalam dunia kamu menderita penganiayaan, tetapi kuatkanlah hatimu, Aku telah mengalahkan dunia." },
            { ref: "1 Yohanes 4:8", text: "Barangsiapa tidak mengasihi, ia tidak mengenal Allah, sebab Allah adalah kasih." },
            { ref: "Galatia 2:20", text: "Aku telah disalibkan dengan Kristus; namun aku hidup, tetapi bukan lagi aku sendiri yang hidup, melainkan Kristus yang hidup di dalam aku." },
            { ref: "Matius 16:24", text: "Kemudian berkatalah Yesus kepada murid-murid-Nya: \"Jika seseorang mau mengikut Aku, ia harus menyangkal dirinya, memikul salibnya, dan mengikut Aku.\"" },
            { ref: "1 Petrus 5:7", text: "Serahkanlah segala kekuatiranmu kepada-Nya, sebab Ia yang memelihara kamu." },
            { ref: "1 Tesalonika 5:18", text: "Mengucap syukurlah dalam segala hal, sebab itulah yang dikehendaki Allah di dalam Kristus Yesus bagi kamu." }
            // Tambah lagi ayat sesuai kebutuhan, misal dari sumber seperti alkitab.sabda.org
        ];

        function getRandomVerse() {
            if (verses.length === 0) return;
            const randomIndex = Math.floor(Math.random() * verses.length);
            const verse = verses[randomIndex];
            const display = document.getElementById('verseDisplay');
            display.innerHTML = `<strong>${verse.ref}</strong> ${verse.text}`;
            display.classList.add('show');
            document.getElementById('verseList').innerHTML = '';
        }

        document.getElementById('searchInput').addEventListener('input', function() {
            const term = this.value.toLowerCase().trim();
            const list = document.getElementById('verseList');
            list.innerHTML = '';

            if (!term) {
                document.getElementById('verseDisplay').classList.remove('show');
                return;
            }

            const filtered = verses.filter(v => 
                v.ref.toLowerCase().includes(term) || v.text.toLowerCase().includes(term)
            );

            if (filtered.length === 0) {
                list.innerHTML = '<li class="no-results">Tidak ditemukan ayat yang cocok. Coba kata lain seperti "kasih", "salib", "Yesus", atau "Yohanes".</li>';
            } else {
                filtered.forEach(v => {
                    const li = document.createElement('li');
                    li.innerHTML = `<strong>${v.ref}</strong> ${v.text}`;
                    list.appendChild(li);
                });
            }

            document.getElementById('verseDisplay').classList.remove('show');
        });

        // Tampilkan satu ayat acak saat halaman dibuka pertama kali
        window.onload = getRandomVerse;
    </script>

</body>
</html>
